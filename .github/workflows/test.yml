name: Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # Called by pages.yml so a deploy can never run ahead of a green suite.
  # workflow_call has no paths-ignore support — the caller controls filtering.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      # Chromium only — playwright.config.js defines a single chromium project.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js starts its own python3 http.server on :8080.
      - name: E2E tests (Playwright — desktop, mobile, tablet)
        run: npm run test:e2e

      # Baselines are Linux PNGs and this runner is Linux, so they are compared
      # natively here. Locally, regenerate with `npm run test:visual:update`,
      # which runs this same image in Docker.
      - name: Visual regression
        run: npm run test:visual

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
