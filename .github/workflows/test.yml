name: Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # Called by pages.yml so a deploy can never run ahead of a green suite.
  # workflow_call has no paths-ignore support — the caller controls filtering.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The editor bundle is committed (static hosting, no build step); fail if
      # it no longer matches the pinned @tiptap/* versions in package-lock.
      - name: Vendored editor bundle is up to date
        run: npm run vendor:tiptap -- --check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install Playwright browsers (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit

      # playwright.config.js starts its own static server (scripts/serve.py) on :8080.
      - name: E2E tests (Playwright — desktop, mobile, tablet)
        run: npm run test:e2e

      # Safari's engine — what iOS / iPadOS users run — on the editing,
      # pagination and export specs.
      - name: E2E tests (Playwright — WebKit)
        run: npm run test:webkit

      # Baselines are Linux PNGs and this runner is Linux, so they are compared
      # natively here. Locally, regenerate with `npm run test:visual:update`,
      # which runs this same image in Docker.
      - name: Visual regression
        run: npm run test:visual

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
