name: Deploy editor to GitHub Pages

on:
  # Deploy only on version tags (v1.0, v1.1, v1.4.2, …).
  # Merging to main runs tests only — no deploy — so main is always a safe
  # integration branch and production changes are always an intentional act.
  push:
    tags:
      - 'v*'

  # Manual rollback: Actions → Run workflow → type the tag to restore (e.g. v1.4).
  # Leave blank to deploy HEAD (useful for re-running a failed deploy without re-tagging).
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or SHA to deploy (e.g. v1.4) — leave blank for HEAD'
        default: ''
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gate: production never gets a build that has not passed the suite.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch rollbacks this resolves the requested tag/SHA;
          # for tag pushes github.ref is already the tag ref.
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: editor

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
