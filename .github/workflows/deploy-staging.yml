name: Deploy to Cloudflare Pages (staging)

on:
  # Deploy every push to a non-main feature branch so the staging environment
  # always reflects the latest work-in-progress.
  push:
    branches-ignore:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'

  # Also triggerable manually for any branch.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: read

concurrency:
  # One staging deploy per branch at a time; newer push cancels older.
  group: pages-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # An open PR for this branch already runs the suite (test.yml on
  # pull_request), so staging only runs it itself when there is none.
  open-pr:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.find.outputs.exists }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq length)
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # No PR yet: run the full suite before staging gets the build — catches
  # breakage early before a PR is even opened.
  test:
    needs: open-pr
    if: needs.open-pr.outputs.exists != 'true'
    uses: ./.github/workflows/test.yml

  # With a PR open this deploys without waiting for the PR's test run.
  deploy:
    needs: [open-pr, test]
    if: ${{ !cancelled() && needs.open-pr.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=staging maps to the custom domain bpdiary-test.arverma.dev.
          # Cloudflare also generates a unique preview URL per branch push, visible
          # in the Actions summary, useful for reviewing multiple branches at once.
          command: pages deploy editor --project-name=bpdiary --branch=staging
          # Allows Cloudflare to post deployment status back to the GitHub PR.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
